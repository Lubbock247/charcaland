<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sugerencias · Servidor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="css/estilo.css?v=11">
</head>
<body data-pagina="sugerencias">
<header id="cabecera"></header>
<main>
<h1>Sugerencias</h1>
<p class="sub">¿Quieres algo en el servidor? Cuéntanoslo.</p>
<div id="login" class="aviso oculto">
<p>Para enviar una sugerencia entra con tu cuenta de Discord (solo leemos tu nombre).</p>
<button id="entrar" type="button">Entrar con Discord</button>
</div>
<form id="form">
<p id="hola" class="fecha"></p>
<label for="tipo">Tipo</label>
<select id="tipo" name="tipo"><option>Mod</option><option>Evento</option><option>Historia</option><option>Otro</option></select>
<label for="texto">Tu idea</label>
<textarea id="texto" name="texto" required maxlength="1500"></textarea>
<button type="submit">Enviar</button>
</form>
<div id="msg" class="aviso oculto"></div>
</main>
<footer id="pie"></footer>
<script src="js/datos.js?v=11"></script>
<script src="js/app.js?v=11"></script>
</body>
</html>
